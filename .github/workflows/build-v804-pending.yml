name: Build MoneyTransfer V8.0.4 pending transfers

on:
  push:
    paths:
      - 'patch_v804_publish/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install extractor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq innoextract

      - name: Download V8.0.3 final installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v8.0.3 -p 'MoneyTransfer_Setup_V8_0_3_FINAL.exe' -D base_installer
          test -s base_installer/MoneyTransfer_Setup_V8_0_3_FINAL.exe

      - name: Extract base and apply audited patch
        shell: bash
        run: |
          set -uo pipefail
          rm -rf v804_extract v804_build
          mkdir -p v804_extract v804_build patch_v804
          : > patch_v804/diagnostics.txt
          if ! innoextract --silent --output-dir v804_extract base_installer/MoneyTransfer_Setup_V8_0_3_FINAL.exe >>patch_v804/diagnostics.txt 2>&1; then
            echo 'INNOEXTRACT_FAILED' >> patch_v804/diagnostics.txt
            exit 11
          fi
          echo '--- extracted files ---' >> patch_v804/diagnostics.txt
          find v804_extract -maxdepth 5 -type f | sort | sed -n '1,240p' >> patch_v804/diagnostics.txt
          DESKTOP_FILE="$(find v804_extract -type f -path '*/desktop/financial_transfer_system_v7_9_0.py' | head -n1)"
          if [ -z "$DESKTOP_FILE" ]; then echo 'DESKTOP_FILE_NOT_FOUND' >> patch_v804/diagnostics.txt; exit 12; fi
          APP_ROOT="${DESKTOP_FILE%/desktop/financial_transfer_system_v7_9_0.py}"
          echo "APP_ROOT=$APP_ROOT" >> patch_v804/diagnostics.txt
          for f in desktop/financial_transfer_system_v7_9_0.py server_runtime/services/transaction_service.py server_runtime/app.py server_runtime/migrations.py version.json; do
            if [ ! -f "$APP_ROOT/$f" ]; then echo "MISSING=$f" >> patch_v804/diagnostics.txt; exit 13; fi
            sha256sum "$APP_ROOT/$f" >> patch_v804/diagnostics.txt
          done
          python - <<'PY'
          import base64,zlib,pathlib
          raw=pathlib.Path('patch_v804/update.patch.zlib.b64').read_text(encoding='ascii').strip()
          pathlib.Path('patch_v804/update.patch').write_bytes(zlib.decompress(base64.b64decode(raw)))
          PY
          echo '--- patch dry run ---' >> patch_v804/diagnostics.txt
          if ! (cd "$APP_ROOT" && patch --dry-run -p1 --fuzz=0 < "$GITHUB_WORKSPACE/patch_v804/update.patch") >>patch_v804/diagnostics.txt 2>&1; then
            echo 'PATCH_DRY_RUN_FAILED' >> patch_v804/diagnostics.txt
            exit 14
          fi
          (cd "$APP_ROOT" && patch -p1 --fuzz=0 < "$GITHUB_WORKSPACE/patch_v804/update.patch") >>patch_v804/diagnostics.txt 2>&1 || exit 15
          printf '%s\n' "$APP_ROOT" > v804_app_root.txt
          python -m py_compile \
            "$APP_ROOT/desktop/financial_transfer_system_v7_9_0.py" \
            "$APP_ROOT/server_runtime/services/transaction_service.py" \
            "$APP_ROOT/server_runtime/app.py" \
            "$APP_ROOT/server_runtime/migrations.py" || exit 16
          grep -q '"app_version": "8.0.4"' "$APP_ROOT/version.json" || exit 17
          grep -q 'CREATE TABLE IF NOT EXISTS pending_transfers' "$APP_ROOT/desktop/financial_transfer_system_v7_9_0.py" || exit 18
          grep -q 'حوالة واردة معلقة' "$APP_ROOT/server_runtime/services/transaction_service.py" || exit 19
          echo 'PATCH_AND_COMPILE_OK' >> patch_v804/diagnostics.txt

      - name: Build full-file updater package
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$(cat v804_app_root.txt)"
          mkdir -p v804_build/desktop v804_build/server_runtime/services releases
          cp "$APP_ROOT/desktop/financial_transfer_system_v7_9_0.py" v804_build/desktop/
          cp "$APP_ROOT/server_runtime/app.py" v804_build/server_runtime/
          cp "$APP_ROOT/server_runtime/migrations.py" v804_build/server_runtime/
          cp "$APP_ROOT/server_runtime/services/transaction_service.py" v804_build/server_runtime/services/
          cp "$APP_ROOT/version.json" v804_build/version.json
          cat > v804_build/update_manifest.json <<'JSON'
          {
            "manifest_version": 2,
            "product": "MoneyTransfer",
            "version": "8.0.4",
            "api_version": "7.26.2",
            "schema_version": 7,
            "channel": "Stable",
            "description": "Pending incoming transfers with delayed cash settlement and settlement commission"
          }
          JSON
          PKG='releases/MoneyTransfer_Update_V8_0_4_Pending_Transfers_R1.zip'
          (cd v804_build && zip -q -9 -r ../$PKG update_manifest.json version.json desktop server_runtime)
          unzip -t "$PKG"
          test "$(stat -c%s "$PKG")" -gt 50000
          SHA="$(sha256sum "$PKG" | awk '{print $1}')"
          python - "$SHA" <<'PY'
          import json,sys,pathlib
          sha=sys.argv[1]
          data={
            "product":"MoneyTransfer",
            "version":"8.0.4",
            "channel":"Stable",
            "package_url":"https://raw.githubusercontent.com/h797hhf4ts-cpu/MoneyTransfer-Updates/main/releases/MoneyTransfer_Update_V8_0_4_Pending_Transfers_R1.zip",
            "sha256":sha,
            "notes_ar":[
              "إضافة الحوالات الواردة المعلقة التي تصل للحساب الإلكتروني قبل تسليم النقد.",
              "عدم خصم الكاش عند وصول الحوالة المعلقة؛ الخصم يتم فقط عند التسليم.",
              "شاشة مستقلة للحوالات المعلقة تستمر بين الأيام والورديات حتى التسوية.",
              "احتساب العمولة عند التسليم مع خيار خصمها من الحوالة أو تسجيلها كعمولة منفصلة.",
              "إظهار أعداد وقيم الحوالات المعلقة والمسلّمة في كشف الوردية ونهاية الوردية.",
              "حماية العمليات المعلقة من التعديل أو الإلغاء العام لمنع عدم تطابق الحسابات."
            ]
          }
          pathlib.Path('patch_v804/latest-v804.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -rf patch_v804_publish v804_build v804_extract base_installer patch_v804/update.patch v804_app_root.txt

      - name: Commit verified V8.0.4 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MoneyTransfer_Update_V8_0_4_Pending_Transfers_R1.zip patch_v804/latest-v804.json patch_v804/diagnostics.txt patch_v804_publish
          git commit -m "Build verified MoneyTransfer V8.0.4 pending transfers R1"
          git push

      - name: Commit diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f patch_v804/diagnostics.txt || echo 'No diagnostics file was produced' > patch_v804/diagnostics.txt
          git add patch_v804/diagnostics.txt
          git commit -m "Record V8.0.4 build diagnostics" || true
          git push || true
