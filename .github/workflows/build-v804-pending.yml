name: Build MoneyTransfer V8.0.4 pending transfers

on:
  push:
    paths:
      - 'patch_v804_publish/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install extractor
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq innoextract

      - name: Download V8.0.3 final installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v8.0.3 -p 'MoneyTransfer_Setup_V8_0_3_FINAL.exe' -D base_installer
          test -s base_installer/MoneyTransfer_Setup_V8_0_3_FINAL.exe

      - name: Extract base and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v804_extract v804_build
          mkdir -p v804_extract v804_build
          innoextract -q -d v804_extract base_installer/MoneyTransfer_Setup_V8_0_3_FINAL.exe
          test -f v804_extract/app/desktop/financial_transfer_system_v7_9_0.py
          test -f v804_extract/app/server_runtime/services/transaction_service.py
          test -f v804_extract/app/server_runtime/app.py
          test -f v804_extract/app/server_runtime/migrations.py
          test -f v804_extract/app/version.json
          python - <<'PY'
          import base64,zlib,pathlib
          raw=pathlib.Path('patch_v804/update.patch.zlib.b64').read_text(encoding='ascii').strip()
          pathlib.Path('patch_v804/update.patch').write_bytes(zlib.decompress(base64.b64decode(raw)))
          PY
          (cd v804_extract/app && patch -p1 --fuzz=0 < ../../patch_v804/update.patch)
          python -m py_compile \
            v804_extract/app/desktop/financial_transfer_system_v7_9_0.py \
            v804_extract/app/server_runtime/services/transaction_service.py \
            v804_extract/app/server_runtime/app.py \
            v804_extract/app/server_runtime/migrations.py
          grep -q '"app_version": "8.0.4"' v804_extract/app/version.json
          grep -q 'CREATE TABLE IF NOT EXISTS pending_transfers' v804_extract/app/desktop/financial_transfer_system_v7_9_0.py
          grep -q 'حوالة واردة معلقة' v804_extract/app/server_runtime/services/transaction_service.py

      - name: Build full-file updater package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v804_build/desktop v804_build/server_runtime/services releases
          cp v804_extract/app/desktop/financial_transfer_system_v7_9_0.py v804_build/desktop/
          cp v804_extract/app/server_runtime/app.py v804_build/server_runtime/
          cp v804_extract/app/server_runtime/migrations.py v804_build/server_runtime/
          cp v804_extract/app/server_runtime/services/transaction_service.py v804_build/server_runtime/services/
          cp v804_extract/app/version.json v804_build/version.json
          cat > v804_build/update_manifest.json <<'JSON'
          {
            "manifest_version": 2,
            "product": "MoneyTransfer",
            "version": "8.0.4",
            "api_version": "7.26.2",
            "schema_version": 7,
            "channel": "Stable",
            "description": "Pending incoming transfers with delayed cash settlement and settlement commission"
          }
          JSON
          PKG='releases/MoneyTransfer_Update_V8_0_4_Pending_Transfers_R1.zip'
          (cd v804_build && zip -q -9 -r ../$PKG update_manifest.json version.json desktop server_runtime)
          unzip -t "$PKG"
          test "$(stat -c%s "$PKG")" -gt 50000
          SHA="$(sha256sum "$PKG" | awk '{print $1}')"
          python - "$SHA" <<'PY'
          import json,sys,pathlib
          sha=sys.argv[1]
          data={
            "product":"MoneyTransfer",
            "version":"8.0.4",
            "channel":"Stable",
            "package_url":"https://raw.githubusercontent.com/h797hhf4ts-cpu/MoneyTransfer-Updates/main/releases/MoneyTransfer_Update_V8_0_4_Pending_Transfers_R1.zip",
            "sha256":sha,
            "notes_ar":[
              "إضافة الحوالات الواردة المعلقة التي تصل للحساب الإلكتروني قبل تسليم النقد.",
              "عدم خصم الكاش عند وصول الحوالة المعلقة؛ الخصم يتم فقط عند التسليم.",
              "شاشة مستقلة للحوالات المعلقة تستمر بين الأيام والورديات حتى التسوية.",
              "احتساب العمولة عند التسليم مع خيار خصمها من الحوالة أو تسجيلها كعمولة منفصلة.",
              "إظهار أعداد وقيم الحوالات المعلقة والمسلّمة في كشف الوردية ونهاية الوردية.",
              "حماية العمليات المعلقة من التعديل أو الإلغاء العام لمنع عدم تطابق الحسابات."
            ]
          }
          pathlib.Path('patch_v804/latest-v804.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -rf patch_v804_publish v804_build v804_extract base_installer patch_v804/update.patch

      - name: Commit verified V8.0.4 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MoneyTransfer_Update_V8_0_4_Pending_Transfers_R1.zip patch_v804/latest-v804.json patch_v804_publish
          git commit -m "Build verified MoneyTransfer V8.0.4 pending transfers R1"
          git push
