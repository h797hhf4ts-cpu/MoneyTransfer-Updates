name: Build MoneyTransfer update asset

on:
  push:
    paths:
      - 'build_payload/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild ZIP from chunks
        shell: bash
        run: |
          set -euo pipefail
          cat build_payload/chunk*.txt | base64 -d > releases/MoneyTransfer_Update_V7_25_1_Production_Test.zip
          echo "8840fd412623c26281144b3ea06b107c97c8e5550f6d85a7e9d447088882ac89  releases/MoneyTransfer_Update_V7_25_1_Production_Test.zip" | sha256sum -c -
          rm -rf build_payload
      - name: Commit update asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MoneyTransfer_Update_V7_25_1_Production_Test.zip build_payload
          git commit -m "Publish MoneyTransfer V7.25.1 production test update"
          git push
